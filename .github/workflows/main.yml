name: Triggered from Teams Button

on:
  repository_dispatch:
    types: [teams_manual_deploy] # This custom event name must match Power Automate

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Trigger
        run: |
          echo "The button in Microsoft Teams was clicked!"
          echo "Triggered by user: ${{ github.event.client_payload.triggered_by }}"
